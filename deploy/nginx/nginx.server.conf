include /etc/nginx/guessword/security.conf;
server {
    # Override the unsafe access_log inherited from the image nginx.conf.
    access_log /var/log/nginx/access.log guessword_safe;
    listen 80;
    server_name _;
    # Do not preserve query arguments on the plaintext redirect.
    return 308 https://$host$uri;
}
server {
    # Override the unsafe access_log inherited from the image nginx.conf.
    access_log /var/log/nginx/access.log guessword_safe;
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/guessword/locations.conf;
}
