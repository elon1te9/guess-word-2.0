# Local HTTP entry point; compose.local.yml binds it to loopback only.
include /etc/nginx/guessword/security.conf;
server {
    # Override the unsafe access_log inherited from the image nginx.conf.
    access_log /var/log/nginx/access.log guessword_safe;
    listen 80;
    server_name _;
    include /etc/nginx/guessword/locations.conf;
}
