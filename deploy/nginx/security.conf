# This file is included in the http context. Never log $request or $request_uri.
log_format guessword_safe '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=guessword_auth:10m rate=10r/m;
# Global budget bounds full dictionary scans even across many source addresses.
limit_req_zone $server_name zone=guessword_ready:1m rate=1r/s;
